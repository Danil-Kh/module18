<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header text-center">
          <h3>Login</h3>
        </div>
        <div class="card-body">
          <form th:action="@{/login}" th:object="${user}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group has-validation">
                <input type="text" id="username" th:field="*{username}" class="form-control"
                       th:classappend="${invalidFeedbackK} ? 'is-invalid'" required>
                <div class="invalid-feedback" th:if="${invalidFeedbackK}">
                  <span th:text="${invalidFeedbackK}"></span>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" th:field="*{password}" class="form-control"
                     th:classappend="${invalidPasswordLogin} ? 'is-invalid'" required>
              <div class="invalid-feedback" th:if="${invalidPasswordLogin}">
                <span th:text="${invalidPasswordLogin}"></span>
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
          </form>
          <div class="mt-3">
            <div class="alert alert-danger text-center" th:if="${param.error}">
              Invalid username or password!
            </div>
            <div class="alert alert-success text-center" th:if="${param.logout}">
              You have been logged out successfully.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
